name: Validate ECHO 0.6 evolution package

on:
  push:
    branches: [main]
    paths:
      - runtime-order.trigger

permissions:
  contents: write

jobs:
  validate-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Normalize runtime order and soundtrack
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const orderPath = 'src/build-order.json';
          const order = JSON.parse(fs.readFileSync(orderPath, 'utf8'));
          const evolutionSections = new Set(['0118', '0119', '0120']);
          const entries = order.filter((entry) => evolutionSections.has(entry.section));
          const remaining = order.filter((entry) => !evolutionSections.has(entry.section));
          const closingIndex = remaining.findIndex((entry) => entry.section === '0113');
          if (closingIndex < 0) throw new Error('Seção de fechamento 0113 não encontrada.');
          const expected = [
            { path: 'src/progression/levels.js', section: '0118' },
            { path: 'src/audio/soundtrack.js', section: '0119' },
            { path: 'src/ui/level-presentation.js', section: '0120' }
          ];
          const bySection = new Map(entries.map((entry) => [entry.section, entry]));
          remaining.splice(closingIndex, 0, ...expected.map((entry) => bySection.get(entry.section) || entry));
          fs.writeFileSync(orderPath, `${JSON.stringify(remaining, null, 2)}\n`);

          const soundtrackPath = 'src/audio/soundtrack.js';
          let soundtrack = fs.readFileSync(soundtrackPath, 'utf8');
          soundtrack = soundtrack.replace('track.id === "deep-quake"', 'musicLayers.trackId === "deep-quake"');
          fs.writeFileSync(soundtrackPath, soundtrack);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build generated runtime
        run: npm run build

      - name: Validate architecture and syntax
        run: npm run check

      - name: Run complete test suite
        run: npm test

      - name: Record successful validation
        run: |
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          VALIDATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > docs/VALIDATION.md <<EOF
          # ECHO 0.6 — Validation record

          The ECHO 0.6 evolution package was generated and validated by GitHub Actions.

          - Source commit: \`${SOURCE_COMMIT}\`
          - Validated at: \`${VALIDATED_AT}\`
          - Runtime build: passed
          - Source architecture and JavaScript syntax: passed
          - Complete Node test suite: passed
          - Real HTTP requests for core/events.js, core/random.js, core/runtime.js and core/qa-panel.js: passed
          - Evolution modules inside the main runtime closure: passed
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/build-order.json src/audio/soundtrack.js game.js docs/VALIDATION.md
          git commit -m "Validate ECHO 0.6 evolution package"
          git push
