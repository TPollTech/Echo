name: Apply ECHO Source Refactor

on:
  push:
    branches: [main]
    paths:
      - refactor-source.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate canonical modular source
        run: |
          node scripts/refactor-game-source.js --write --force
          node scripts/group-game-source.js
          node scripts/consolidate-game-source.js

      - name: Verify byte-equivalent bundle
        run: node scripts/build-game.js --check

      - name: Verify source structure
        run: node scripts/check-source-structure.js

      - name: Run existing validation
        run: |
          npm run check
          npm test

      - name: Commit generated source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Consolidate game source into canonical modules"
          git push origin main
