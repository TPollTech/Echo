name: Finish ECHO feature set

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finish:
    if: github.event.head_commit.message == 'Bootstrap ECHO feature completion'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore targeted patch
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          from pathlib import Path
          payload = """"""
          Path('/tmp/patch_echo.py').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          python /tmp/patch_echo.py

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Validate JavaScript syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Commit and push completed implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js index.html styles.css
          git diff --cached --stat
          git commit -m "Finish bosses, archetypes and skins"
          git push origin HEAD:main
