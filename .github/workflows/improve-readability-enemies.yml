name: Improve ECHO readability and enemies

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  improve-readability-and-enemies:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply readability and enemy identity pass
        env:
          PATCH_ZLIB: ""
        run: |
          python3 - <<'PYCODE'
          import base64
          import os
          import zlib
          source = zlib.decompress(base64.b64decode(os.environ['PATCH_ZLIB']))
          exec(compile(source, '<echo-readability-patch>', 'exec'))
          PYCODE
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Validate JavaScript
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Commit and push improvements
        run: |
          rm -f .github/workflows/improve-readability-enemies.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js styles.css .github/workflows/improve-readability-enemies.yml
          git commit -m "Improve readability and enemy identity"
          git push
