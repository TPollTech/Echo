name: ECHO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: npm run check
      - run: npm test

  validate-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package.json
      - run: cd server && npm install --ignore-scripts
      - run: node --check server/index.js
      - run: node --check server/database.js
      - run: node --check server/multiplayer.js
      - run: node --check server/redis.js
      - run: node --check server/auth.js
      - run: node --check server/validation.js
      - run: node --check server/rate-limit.js
