name: Improve ECHO soundtrack

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  replace-soundtrack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Replace continuous drones with sequenced music
        env:
          MUSIC_BLOCK_ZLIB: ""
        run: |
          python3 - <<'PY'
          import base64
          import os
          import zlib
          from pathlib import Path

          path = Path('game.js')
          source = path.read_text(encoding='utf-8')
          start_marker = '  const MUSIC_LAYERS = ['
          end_marker = '  function loadSettings() {'
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          block = zlib.decompress(base64.b64decode(os.environ['MUSIC_BLOCK_ZLIB'])).decode('utf-8')
          path.write_text(source[:start] + block + source[end:], encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Commit soundtrack
        run: |
          rm -f .github/workflows/improve-soundtrack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js .github/workflows/improve-soundtrack.yml
          git commit -m "Replace soundtrack with adaptive sequenced music"
          git push
