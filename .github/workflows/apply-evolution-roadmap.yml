name: Apply ECHO evolution roadmap

on:
  push:
    branches: [main]
    paths:
      - roadmap-evolution.trigger

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Register modules and align version
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const orderPath = 'src/build-order.json';
          const order = JSON.parse(fs.readFileSync(orderPath, 'utf8'));
          const additions = [
            { path: 'src/progression/levels.js', section: '0118' },
            { path: 'src/audio/soundtrack.js', section: '0119' },
            { path: 'src/ui/level-presentation.js', section: '0120' }
          ];
          for (const entry of additions) {
            if (!order.some((candidate) => candidate.path === entry.path && candidate.section === entry.section)) order.push(entry);
          }
          fs.writeFileSync(orderPath, `${JSON.stringify(order, null, 2)}\n`);

          const enemyPath = 'src/enemies/enemy-ai.js';
          let enemy = fs.readFileSync(enemyPath, 'utf8');
          const replacements = [
            [
              'bot.speed = bot.baseSpeed * 1.4;\n          bot.attackDamage = Math.ceil(definition.attackDamage * 1.5);',
              'bot.speed = bot.baseSpeed * 1.4 * (bot.levelSpeedScale || 1);\n          bot.attackDamage = Math.ceil((bot.baseAttackDamage || definition.attackDamage) * 1.5);'
            ],
            [
              'bot.speed = bot.baseSpeed;\n          bot.attackDamage = definition.attackDamage;',
              'bot.speed = bot.baseSpeed * (bot.levelSpeedScale || 1);\n          bot.attackDamage = bot.baseAttackDamage || definition.attackDamage;'
            ],
            [
              'bot.speed = bot.baseSpeed * (1 + Math.min(0.3, nearbyPack * 0.1));',
              'bot.speed = bot.baseSpeed * (bot.levelSpeedScale || 1) * (1 + Math.min(0.3, nearbyPack * 0.1));'
            ]
          ];
          for (const [before, after] of replacements) {
            if (!enemy.includes(after)) {
              if (!enemy.includes(before)) throw new Error(`Trecho esperado não encontrado em ${enemyPath}: ${before}`);
              enemy = enemy.replace(before, after);
            }
          }
          fs.writeFileSync(enemyPath, enemy);

          for (const file of ['package.json', 'package-lock.json']) {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            data.version = '0.6.0';
            if (data.packages?.['']) data.packages[''].version = '0.6.0';
            fs.writeFileSync(file, `${JSON.stringify(data, null, 2)}\n`);
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build generated runtime
        run: npm run build

      - name: Validate architecture and syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Commit validated runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/build-order.json src/enemies/enemy-ai.js game.js package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Build ECHO 0.6 evolution runtime"
            git push
          fi
