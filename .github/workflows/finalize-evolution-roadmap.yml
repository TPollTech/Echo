name: Finalize ECHO evolution roadmap

on:
  push:
    branches: [main]
    paths:
      - finalize-roadmap.trigger

permissions:
  contents: write

jobs:
  build-test-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Register final roadmap modules inside runtime
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const orderPath = 'src/build-order.json';
          const order = JSON.parse(fs.readFileSync(orderPath, 'utf8'));
          const managedSections = new Set(['0118', '0119', '0120', '0121', '0122']);
          const existing = new Map(
            order
              .filter((entry) => managedSections.has(entry.section))
              .map((entry) => [entry.section, entry])
          );
          const remaining = order.filter((entry) => !managedSections.has(entry.section));
          const closingIndex = remaining.findIndex((entry) => entry.section === '0113');
          if (closingIndex < 0) throw new Error('Seção de fechamento 0113 não encontrada.');
          const expected = [
            { path: 'src/progression/levels.js', section: '0118' },
            { path: 'src/audio/soundtrack.js', section: '0119' },
            { path: 'src/ui/level-presentation.js', section: '0120' },
            { path: 'src/audio/state-soundtrack.js', section: '0121' },
            { path: 'src/core/multiplayer-levels.js', section: '0122' }
          ];
          remaining.splice(closingIndex, 0, ...expected.map((entry) => existing.get(entry.section) || entry));
          fs.writeFileSync(orderPath, `${JSON.stringify(remaining, null, 2)}\n`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Build generated browser runtime
        run: npm run build

      - name: Validate architecture and syntax
        run: npm run check

      - name: Run complete regression suite
        run: npm test

      - name: Write validation record and publish bundle
        run: |
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          VALIDATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > docs/VALIDATION.md <<EOF
          # ECHO 0.6 — Validation record

          The complete ECHO 0.6 evolution roadmap was generated and validated by GitHub Actions.

          - Source commit: \`${SOURCE_COMMIT}\`
          - Validated at: \`${VALIDATED_AT}\`
          - Runtime build: passed
          - Source architecture and JavaScript syntax: passed
          - Complete Node test suite: passed
          - Real HTTP requests for core/events.js, core/random.js, core/runtime.js and core/qa-panel.js: passed
          - Player and bot level/experience integration checks: passed
          - Bot resource, flee, hunt and experience-drop source checks: passed
          - Adaptive boss size and scaling checks: passed
          - Ten procedural soundtrack themes and menu/victory/defeat state checks: passed
          - Multiplayer authoritative-score level presentation checks: passed
          - All evolution modules inside the main runtime closure: passed
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/build-order.json game.js docs/VALIDATION.md
          git commit -m "Finalize validated ECHO 0.6 evolution roadmap"
          git push
