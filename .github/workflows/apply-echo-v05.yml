name: Apply ECHO 0.5 Combat Identity

on:
  push:
    branches: [main]
    paths:
      - v05.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Decode integration patch
        env:
          PATCH_GZ_B64: ""
        run: |
          printf '%s' "$PATCH_GZ_B64" | base64 --decode | gzip --decompress > patch_repo.py
          python patch_repo.py

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Validate syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Commit ECHO 0.5
        run: |
          rm -f patch_repo.py v05.trigger .github/workflows/apply-echo-v05.yml
          git config user.name "ECHO Combat Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Implement ECHO 0.5 combat identity"
          git push origin main
