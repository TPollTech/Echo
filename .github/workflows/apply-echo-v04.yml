name: Finalize ECHO 0.4 Foundation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-echo-v04.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Integrate ECHO core
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['version'] = '0.4.0'
          package['description'] = 'ECHO - arena espectral com runs reproduzíveis, QA e multiplayer local'
          package['scripts']['check'] = ' && '.join([
            'node --check game.js',
            'node --check core/events.js',
            'node --check core/random.js',
            'node --check core/runtime.js',
            'node --check core/qa-panel.js',
            'node --check shared/simulation.js',
            'node --check server/database.js',
            'node --check server/multiplayer.js',
            'node --check server/index.js'
          ])
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          index = index.replace('BUILD 0.3', 'BUILD 0.4')
          old_scripts = '  <script src="./shared/simulation.js"></script>\n  <script src="./game.js"></script>'
          new_scripts = '  <script src="./core/events.js"></script>\n  <script src="./core/random.js"></script>\n  <script src="./core/runtime.js"></script>\n  <script src="./shared/simulation.js"></script>\n  <script src="./game.js"></script>\n  <script src="./core/qa-panel.js"></script>'
          if old_scripts not in index:
            raise SystemExit('Bloco de scripts esperado não encontrado em index.html')
          index = index.replace(old_scripts, new_scripts, 1)
          index_path.write_text(index, encoding='utf-8')

          game_path = Path('game.js')
          game = game_path.read_text(encoding='utf-8')
          old_boot = '  const simulation = window.EchoSimulation;\n  if (!simulation) throw new Error("O módulo compartilhado de simulação não foi carregado.");\n  const {'
          new_boot = '  const core = window.EchoCore;\n  if (!core) throw new Error("O núcleo modular do ECHO não foi carregado.");\n  const gameEvents = core.events;\n  const simulation = window.EchoSimulation;\n  if (!simulation) throw new Error("O módulo compartilhado de simulação não foi carregado.");\n  const {'
          if old_boot not in game:
            raise SystemExit('Bootstrap esperado não encontrado em game.js')
          game = game.replace(old_boot, new_boot, 1)
          marker = '  } = simulation;\n  const ui = {'
          replacement = '  } = simulation;\n  window.EchoGameEvents = gameEvents;\n  gameEvents.emit("runtime:game-loaded", { version: core.version, seed: core.seed });\n  const ui = {'
          if marker not in game:
            raise SystemExit('Marcador de integração não encontrado em game.js')
          game = game.replace(marker, replacement, 1)
          game_path.write_text(game, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8').rstrip()
          if '## Fundação 0.4' not in readme:
            readme += '''

## Fundação 0.4

A versão 0.4 inicia a execução do Hiperplano ECHO 1.0:

- runs reproduzíveis por seed (`?seed=ECHO-7F42A`);
- barramento de eventos desacoplado;
- painel de QA com `?qa`;
- CI permanente em todo push e pull request;
- testes do núcleo determinístico;
- documentação em `docs/`.

Use `http://localhost:4174/?qa&seed=ECHO-7F42A` para abrir uma run reproduzível com o painel de QA.
'''
          readme_path.write_text(readme + '\n', encoding='utf-8')

          plan_path = Path('docs/HYPERPLAN.md')
          plan = plan_path.read_text(encoding='utf-8')
          plan = plan.replace('- [ ] CI permanente', '- [x] CI permanente')
          plan = plan.replace('- [ ] Integração do núcleo ao carregamento', '- [x] Integração do núcleo ao carregamento')
          plan_path.write_text(plan, encoding='utf-8')
          PY

      - name: Validate
        run: |
          npm install --ignore-scripts
          npm run check
          npm test

      - name: Commit ECHO 0.4
        run: |
          rm -f .github/workflows/apply-echo-v04.yml
          git config user.name "ECHO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json index.html game.js README.md docs/HYPERPLAN.md .github/workflows/apply-echo-v04.yml
          git commit -m "Complete ECHO 0.4 foundation"
          git push origin main
