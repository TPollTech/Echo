name: Apply ECHO 0.4 Foundation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-echo-v04.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Create foundation modules
        env:
          ECHO_FILES: '{"core/events.js": "", "core/random.js": "", "core/runtime.js": "", "core/qa-panel.js": "", "test/core-events.test.js": "", "test/core-random.test.js": "", ".github/workflows/ci.yml": "", "docs/ARCHITECTURE.md": "", "docs/HYPERPLAN.md": ""}'
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          files = json.loads(os.environ["ECHO_FILES"])
          for path, encoded in files.items():
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(encoded))
          PY

      - name: Integrate foundation
        run: |
          python - <<'PY'
          import json
          import textwrap
          from pathlib import Path

          package_path = Path("package.json")
          package = json.loads(package_path.read_text(encoding="utf-8"))
          package["version"] = "0.4.0"
          package["description"] = "ECHO - arena espectral com runs reproduzíveis, QA e multiplayer local"
          checks = [
              "node --check game.js",
              "node --check core/events.js",
              "node --check core/random.js",
              "node --check core/runtime.js",
              "node --check core/qa-panel.js",
              "node --check shared/simulation.js",
              "node --check server/database.js",
              "node --check server/multiplayer.js",
              "node --check server/index.js"
          ]
          package.setdefault("scripts", {})["check"] = " && ".join(checks)
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          index_path = Path("index.html")
          index = index_path.read_text(encoding="utf-8")
          index = index.replace("BUILD 0.3", "BUILD 0.4")
          old_scripts = '''  <script src="./shared/simulation.js"></script>
  <script src="./game.js"></script>'''
          new_scripts = '''  <script src="./core/events.js"></script>
  <script src="./core/random.js"></script>
  <script src="./core/runtime.js"></script>
  <script src="./shared/simulation.js"></script>
  <script src="./game.js"></script>
  <script src="./core/qa-panel.js"></script>'''
          if old_scripts not in index:
              raise SystemExit("Bloco de scripts esperado não foi encontrado em index.html")
          index = index.replace(old_scripts, new_scripts)
          index_path.write_text(index, encoding="utf-8")

          game_path = Path("game.js")
          game = game_path.read_text(encoding="utf-8")
          old_boot = '''  const simulation = window.EchoSimulation;
  if (!simulation) throw new Error("O módulo compartilhado de simulação não foi carregado.");
  const {'''
          new_boot = '''  const core = window.EchoCore;
  if (!core) throw new Error("O núcleo modular do ECHO não foi carregado.");
  const gameEvents = core.events;
  const simulation = window.EchoSimulation;
  if (!simulation) throw new Error("O módulo compartilhado de simulação não foi carregado.");
  const {'''
          if old_boot not in game:
              raise SystemExit("Bootstrap esperado não foi encontrado em game.js")
          game = game.replace(old_boot, new_boot, 1)
          marker = '''  } = simulation;
  const ui = {'''
          replacement = '''  } = simulation;
  window.EchoGameEvents = gameEvents;
  gameEvents.emit("runtime:game-loaded", { version: core.version, seed: core.seed });
  const ui = {'''
          if marker not in game:
              raise SystemExit("Marcador de integração não foi encontrado em game.js")
          game = game.replace(marker, replacement, 1)
          game_path.write_text(game, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          section = '''

## Fundação 0.4

A versão 0.4 inicia a execução do Hiperplano ECHO 1.0:

- runs reproduzíveis por seed (`?seed=ECHO-7F42A`);
- barramento de eventos desacoplado em `core/events.js`;
- painel de QA com `?qa`;
- CI permanente em todo push e pull request;
- testes do núcleo determinístico;
- documentação de arquitetura e roadmap em `docs/`.

Para reproduzir uma run específica:

```text
http://localhost:4174/?seed=ECHO-7F42A
```

Para abrir o painel de QA:

```text
http://localhost:4174/?qa&seed=ECHO-7F42A
```
'''
          if "## Fundação 0.4" not in readme:
              readme = readme.rstrip() + "\n" + textwrap.dedent(section).strip() + "\n"
          readme_path.write_text(readme, encoding="utf-8")
          PY

      - name: Install and validate
        run: |
          npm install --ignore-scripts
          npm run check
          npm test

      - name: Commit foundation
        run: |
          rm -f .github/workflows/apply-echo-v04.yml
          git config user.name "ECHO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json index.html game.js README.md core test docs .github/workflows/ci.yml .github/workflows/apply-echo-v04.yml
          git commit -m "Build ECHO 0.4 foundation"
          git push origin main
