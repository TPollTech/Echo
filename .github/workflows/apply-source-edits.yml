name: Apply ECHO Modular Source Edits

on:
  push:
    branches: [main]
    paths:
      - source-edit.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build generated runtime
        run: npm run build

      - name: Validate architecture and syntax
        run: npm run check

      - name: Run complete test suite
        run: npm test

      - name: Commit generated bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js
          if git diff --cached --quiet; then
            echo "Bundle already synchronized."
            exit 0
          fi
          git commit -m "Build modular game runtime"
          git push origin main
