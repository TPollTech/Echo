name: Apply run evolution package

on:
  push:
    branches:
      - feat/run-evolution-roadmap
    paths:
      - run-evolution.trigger

permissions:
  contents: write

jobs:
  apply-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/run-evolution-roadmap
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply source package
        run: node scripts/apply-run-evolution-package.js

      - name: Apply performance package
        run: node scripts/apply-performance-package.js

      - name: Build generated runtime
        run: npm run build

      - name: Validate architecture and syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Commit validated package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game.js index.html styles.css package.json package-lock.json core/runtime.js README.md docs/HYPERPLAN.md src test tests
          git commit -m "feat: implement run evolution, bosses and performance"
          git push origin HEAD:feat/run-evolution-roadmap
